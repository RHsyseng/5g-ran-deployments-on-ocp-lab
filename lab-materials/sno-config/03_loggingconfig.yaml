---
apiVersion: v1
kind: Secret
metadata:
  name: mtls-tenant-snos
  namespace: openshift-logging
data:
  ca-bundle.crt: 
  tls.crt: 
  tls.key: 
---
apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: instance
  namespace: openshift-logging
spec:
  filters:
  - name: ran-du-labels
    type: openshiftLabels
    openshiftLabels:
      cluster-type: "du-sno"
  serviceAccount:
    name: collector
  outputs:
  - name: loki-hub
    type: "loki"
    loki:
      url: https://logging-loki-openshift-logging.apps.hub.5g-deployment.lab/api/logs/v1/tenant-snos
      labelKeys:
      - log_type
      - kubernetes.namespace_name
      - kubernetes.pod_name
      - openshift.cluster_id
    tls:
      insecureSkipVerify: true
      ca:
        key: ca-bundle.crt
        secretName: mtls-tenant-snos
      certificate:
        key: tls.crt
        secretName: mtls-tenant-snos
      key:
        key: tls.key
        secretName: mtls-tenant-snos
  pipelines:
  - name: sno-logs
    inputRefs:
#    - application
    - infrastructure
    - audit
    outputRefs:
    - loki-hub
    filterRefs:
    - ran-du-labels