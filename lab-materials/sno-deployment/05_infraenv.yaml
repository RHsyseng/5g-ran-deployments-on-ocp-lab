---
apiVersion: agent-install.openshift.io/v1beta1
kind: InfraEnv
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: sno-seed
  namespace: sno-seed
spec:
  additionalNTPSources:
    - infra.5g-deployment.lab
  clusterRef:
    name: sno-seed
    namespace: sno-seed
  sshAuthorizedKey: 'ssh-rsa '
  agentLabels:
      cluster-name: "sno-seed"
  pullSecretRef:
    name: pullsecret
  ignitionConfigOverride: '{"ignition":{"version":"3.2.0"},"storage":{"files":[{"path":"/etc/containers/policy.json","mode":420,"overwrite":true,"contents":{"source":"data:text/plain;charset=utf-8;base64,"}}]}}'
